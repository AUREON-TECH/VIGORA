<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>VIGORA | Segurança</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#090b10;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,440px);background:#151821;border:1px solid #292e3c;border-radius:24px;padding:28px}h1{font-size:32px;margin:0 0 8px}.tag{color:#9ca7ba;margin:0 0 24px}.notice{background:#1d2230;padding:14px;border-radius:14px;font-size:14px;line-height:1.45;margin-bottom:20px}button{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:16px;margin:7px 0;cursor:pointer}.primary{background:#fff;color:#090b10}.secondary{background:#262c39;color:#fff}video,img{width:100%;border-radius:16px;margin-top:14px;display:none}#status{font-size:14px;color:#b8c1d1;line-height:1.5;margin-top:16px}.ok{color:#82e6a4}</style></head><body><main class="card"><h1>VIGORA</h1><p class="tag">Proteção e localização em situações de segurança.</p><div class="notice">Para sua segurança, o VIGORA só acessa <b>localização e câmera após sua autorização explícita</b>. Você pode negar ou interromper o acesso a qualquer momento.</div><button class="primary" id="loc">Compartilhar minha localização</button><button class="secondary" id="cam">Abrir câmera</button><video id="video" autoplay playsinline></video><button class="secondary" id="shot" style="display:none">Tirar e confirmar foto</button><canvas id="canvas" hidden></canvas><img id="photo" alt="Foto confirmada"><div id="status">Nenhum dado compartilhado ainda.</div></main><script>let position=null,photo=null,stream=null;const s=document.querySelector('#status');document.querySelector('#loc').onclick=()=>{if(!navigator.geolocation)return s.textContent='Localização não suportada neste aparelho.';s.textContent='Aguardando sua autorização de localização…';navigator.geolocation.getCurrentPosition(p=>{position={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};s.innerHTML='<span class="ok">✓ Localização autorizada.</span><br>Precisão aproximada: '+Math.round(p.coords.accuracy)+' m';console.log('VIGORA location',position)},e=>s.textContent='Localização não compartilhada: '+e.message,{enableHighAccuracy:true,timeout:15000})};document.querySelector('#cam').onclick=async()=>{try{s.textContent='Aguardando sua autorização de câmera…';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});const v=document.querySelector('#video');v.srcObject=stream;v.style.display='block';document.querySelector('#shot').style.display='block';s.innerHTML='<span class="ok">✓ Câmera autorizada.</span> A foto só será criada quando você tocar no botão abaixo.'}catch(e){s.textContent='Câmera não compartilhada: '+e.message}};document.querySelector('#shot').onclick=()=>{const v=document.querySelector('#video'),c=document.querySelector('#canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);photo=c.toDataURL('image/jpeg',.85);const im=document.querySelector('#photo');im.src=photo;im.style.display='block';stream?.getTracks().forEach(t=>t.stop());v.style.display='none';document.querySelector('#shot').style.display='none';s.innerHTML='<span class="ok">✓ Foto confirmada.</span><br>'+(position?'Localização e foto estão prontas para envio seguro ao painel.':'Autorize também a localização para formar o registro completo.')}};</script></body></html>
